[package]
name = "datumesh-engine"
version = "0.2.0"
description = "The Datumesh engine: the value of a cell as of a time, from stored receipts or by evaluating functions; memoised, and signed for computed cells."
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/datumesh-com/datumesh-engine"
homepage = "https://datumesh.com"
documentation = "https://docs.rs/datumesh-engine"
readme = "README.md"
keywords = ["datumesh", "receipt", "memoization", "provenance", "engine"]
categories = ["database"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE", "README.md"]

[features]
default = []
# NativeTest: a runtime of Rust closures keyed by function hash, for tests and benchmarks.
native-test = []

[dependencies]
datumesh-core = { version = "0.3.3", features = ["sign"] }
datumesh-store = "0.3.0"
tracing = "0.1.44"

[dev-dependencies]
datumesh-core = { version = "0.3.3", features = ["sign", "testkit"] }

[[example]]
name = "bench"
required-features = ["native-test"]

# curve25519 and sha2 are optimised even in test builds: the tests sign and verify many
# receipts.
[profile.dev.package."*"]
opt-level = 3

[package.metadata.docs.rs]
all-features = true

# The integration tests use the native-test runtime: `cargo test --all-features`.
[[test]]
name = "stored"
required-features = ["native-test"]

[[test]]
name = "computed"
required-features = ["native-test"]

[[test]]
name = "memo"
required-features = ["native-test"]

[[test]]
name = "early_cutoff"
required-features = ["native-test"]

[[test]]
name = "recursion"
required-features = ["native-test"]

[[test]]
name = "budget"
required-features = ["native-test"]

[[test]]
name = "concurrency"
required-features = ["native-test"]

[[test]]
name = "conformance"
required-features = ["native-test"]
